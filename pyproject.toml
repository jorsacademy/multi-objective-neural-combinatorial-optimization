[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-objective-neural-combinatorial-optimization"
version = "0.1.0"
description = "Verification-first preference- and constraint-conditioned neural Pareto-set approximation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "jorsacademy" }]
keywords = [
  "multi-objective optimization",
  "neural combinatorial optimization",
  "Pareto frontier",
  "knapsack",
  "hypervolume",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26,<3",
  "safetensors>=0.4,<1",
  "torch>=2.2,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
]

[project.scripts]
mopareto = "mopareto.cli:main"

[project.urls]
Repository = "https://github.com/jorsacademy/multi-objective-neural-combinatorial-optimization"
Issues = "https://github.com/jorsacademy/multi-objective-neural-combinatorial-optimization/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mopareto = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "PIE"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
show_error_codes = true
packages = ["mopareto"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/mopareto --cov-branch --cov-report=term-missing --cov-fail-under=84"
