name: One-time Ruff cleanup

on:
  push:
    branches: [epsilon-conditioned-pareto-learning]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: epsilon-conditioned-pareto-learning
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Apply and verify Ruff cleanup
        run: |
          python -m pip install "ruff==0.16.6"
          ruff check --fix . || true
          ruff format .
          ruff check .

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No Ruff changes to commit."
            exit 0
          fi
          git commit -m "Apply Ruff lint and formatting cleanup"
          git push origin HEAD:epsilon-conditioned-pareto-learning
