name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strict-typing-cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: epsilon-conditioned-pareto-learning
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2,<3"
          python -m pip install -e ".[dev]"

      - name: Apply and verify strict typing fixes
        run: |
          python - <<'PY'
          from pathlib import Path


          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise RuntimeError(f"expected text not found in {path}: {old[:120]!r}")
              target.write_text(text.replace(old, new), encoding="utf-8")


          replace(
              "src/mopareto/domain.py",
              (
                  "        numeric = (total_weight, objective_1, objective_2)\n"
                  "        if not all(isinstance(value, int) and not isinstance(value, bool) for value in numeric):\n"
                  "            raise ValueError(\"solution totals and objectives must be integers\")\n"
                  "        return cls(tuple(selection), int(total_weight), int(objective_1), int(objective_2))\n"
              ),
              (
                  "        if (\n"
                  "            not isinstance(total_weight, int)\n"
                  "            or isinstance(total_weight, bool)\n"
                  "            or not isinstance(objective_1, int)\n"
                  "            or isinstance(objective_1, bool)\n"
                  "            or not isinstance(objective_2, int)\n"
                  "            or isinstance(objective_2, bool)\n"
                  "        ):\n"
                  "            raise ValueError(\"solution totals and objectives must be integers\")\n"
                  "        return cls(tuple(selection), total_weight, objective_1, objective_2)\n"
              ),
          )
          replace(
              "src/mopareto/pareto.py",
              "            boundary = -intercept / slope\n",
              "            boundary = Fraction(-intercept, slope)\n",
          )
          replace(
              "src/mopareto/models.py",
              (
                  "    return model(\n"
                  "        item_features(instance, device=model.device),\n"
                  "        condition_features(model.mode, condition, device=model.device),\n"
                  "    )\n"
              ),
              (
                  "    return cast(\n"
                  "        Tensor,\n"
                  "        model(\n"
                  "            item_features(instance, device=model.device),\n"
                  "            condition_features(model.mode, condition, device=model.device),\n"
                  "        ),\n"
                  "    )\n"
              ),
          )
          replace(
              "src/mopareto/training.py",
              "            loss.backward()\n",
              "            loss.backward()  # type: ignore[no-untyped-call] -- PyTorch stub boundary.\n",
          )
          PY
          ruff format .
          ruff check .
          ruff format --check .
          mypy --python-version "3.11" src
          mypy --python-version "3.12" src
          pytest

      - name: Commit typing fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No typing changes to commit."
            exit 0
          fi
          git commit -m "Fix strict typing boundaries"
          git push origin HEAD:epsilon-conditioned-pareto-learning

  quality:
    if: github.actor == 'github-actions[bot]'
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2,<3"
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type check
        run: mypy --python-version "${{ matrix.python-version }}" src

      - name: Test with branch coverage
        run: pytest

      - name: End-to-end exact-front and conditional-policy smoke
        run: |
          mopareto collect \
            --count 5 --item-counts 4 5 6 \
            --regimes independent weakly_conflicting \
            --seed 100 --output /tmp/train.jsonl
          mopareto collect \
            --count 3 --item-counts 4 5 \
            --regimes independent strongly_conflicting \
            --seed 200 --output /tmp/validation.jsonl
          mopareto train /tmp/train.jsonl \
            --validation /tmp/validation.jsonl \
            --model weighted_sum --epochs 1 \
            --hidden-dim 8 --hidden-layers 1 \
            --conditions-per-instance 3 --batch-size 8 --seed 300 \
            --checkpoint /tmp/weighted.safetensors
          mopareto train /tmp/train.jsonl \
            --validation /tmp/validation.jsonl \
            --model epsilon_constraint --epochs 1 \
            --hidden-dim 8 --hidden-layers 1 \
            --conditions-per-instance 3 --batch-size 8 --seed 400 \
            --checkpoint /tmp/epsilon.safetensors
          mopareto oracle /tmp/validation.jsonl \
            --sample-index 0 --output /tmp/oracle.json
          mopareto benchmark /tmp/validation.jsonl \
            --weighted-checkpoint /tmp/weighted.safetensors \
            --epsilon-checkpoint /tmp/epsilon.safetensors \
            --scenario smoke --query-budget 5 --bootstrap-draws 10 \
            --output-json /tmp/benchmark.json \
            --output-csv /tmp/benchmark.csv
